baseURL = "https://accountableimpactcommons.org/"
languageCode = "en"
title = "Accountable Impact Commons"
theme = "PaperMod"
enableRobotsTXT = true
timeZone = "Africa/Johannesburg"

[pagination]
  pagerSize = 10

[params]
  description = "Accountable Impact Commons, an LF Decentralized Trust lab building open semantic standards for impact accounting."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  mainSections = ["posts"]

  [params.label]
    text = "Accountable Impact Commons"
    icon = "/favicon-32x32.png"
    iconHeight = 26

  [params.homeInfoParams]
    Title = "Accountable Impact Commons"
    Content = """
Accountable Impact Commons is a Lab at [LF Decentralized Trust](https://www.lfdecentralizedtrust.org/), part of the Linux Foundation. The Lab maintains the Anthropogenic Impact Accounting Ontology Suite, a semantic framework for representing anthropogenic impact accounting data in a machine-readable format.

The suite currently consists of four specialised ontologies, each published at a permanent W3ID address that resolves to its documentation and machine-readable files.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Accountable-Impact-Commons"
  [[params.socialIcons]]
    name = "discord"
    url = "https://discord.gg/hyperledger"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "ontologies"
    name = "Ontologies"
    url = "/ontologies/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
