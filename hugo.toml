baseURL = "https://accountableimpactcommons.org/"
languageCode = "en"
title = "Accountable Impact Commons"
theme = "PaperMod"
enableRobotsTXT = true
timeZone = "Africa/Johannesburg"

[pagination]
  pagerSize = 10

[params]
  description = "Accountable Impact Commons, an LF Decentralized Trust lab building open semantic standards for impact accounting."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "Accountable Impact Commons"
    Content = "An LF Decentralized Trust lab building open, machine-readable standards for accounting for the impact of human activity. We publish ontologies and tooling that let claims about impact be stated, substantiated and audited."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Accountable-Impact-Commons"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "ontologies"
    name = "Ontologies"
    url = "/ontologies/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
